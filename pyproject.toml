[project]
name = "writ"
version = "0.2.0"
description = "Writ: an execution authority for AI agents. A trap-table gateway that binds every consequential action to a bounded, expiring, revocable task contract and executes it through an isolated, credentialed executor."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Writ Authors" }]
keywords = ["ai-agents", "authorization", "security", "capability", "mcp", "execution-authority"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "cryptography>=42",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "mcp>=2.0",
]

[project.urls]
Documentation = "https://github.com/writ-authority/writ/tree/main/docs"
Changelog = "https://github.com/writ-authority/writ/blob/main/CHANGELOG.md"
Security = "https://github.com/writ-authority/writ/blob/main/SECURITY.md"

[project.optional-dependencies]
agent = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "pip-audit>=2.7"]
research = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
writ = "writ.cli:app"
writ-gate = "writ.gate.main:main"
writ-executor = "writ.executor.main:main"
writ-demo-saas = "writ.demosaas.main:main"
writ-mcp = "writ.mcp_server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writ"]

[tool.hatch.build.targets.sdist]
include = ["src/writ", "config", "templates", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
